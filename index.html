<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const storageKey = "rsmethods-theme";
        const legacyStorageKey = "osrstool-theme";
        const root = document.documentElement;
        const storedTheme =
          window.localStorage.getItem(storageKey) ??
          window.localStorage.getItem(legacyStorageKey);
        const systemTheme = window.matchMedia("(prefers-color-scheme: dark)")
          .matches
          ? "dark"
          : "light";
        const theme =
          storedTheme === "dark" || storedTheme === "light"
            ? storedTheme
            : systemTheme;

        root.classList.toggle("dark", theme === "dark");
        root.style.colorScheme = theme;
        root.dataset.theme = theme;
      })();
    </script>
    <script type="module">
      (() => {
        const robotsContent = import.meta.env.VITE_ROBOTS?.trim();
        if (!robotsContent) {
          return;
        }

        let tag = document.head.querySelector('meta[name="robots"]');
        if (!tag) {
          tag = document.createElement("meta");
          tag.setAttribute("name", "robots");
          document.head.appendChild(tag);
        }

        tag.setAttribute("content", robotsContent);
      })();
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
